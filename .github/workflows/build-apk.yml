name: Build INFINITY Android TV APK
on:
  push:
    branches:
      - feature/infinity-v1
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: infinity-apk-build
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35 SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "::error::SDK manager not installed in $SDK_ROOT"; exit 1; fi
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore optional stable release signing
        env:
          INFINITY_KEYSTORE_B64: ${{ secrets.INFINITY_KEYSTORE_B64 }}
        shell: bash
        run: |
          if [ -n "$INFINITY_KEYSTORE_B64" ]; then
            printf '%s' "$INFINITY_KEYSTORE_B64" | base64 --decode > app/infinity-signing.jks
            echo "INFINITY_SIGNED=true" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        env:
          INFINITY_KEYSTORE_PATH: ${{ github.workspace }}/app/infinity-signing.jks
          INFINITY_STORE_PASS: ${{ secrets.INFINITY_STORE_PASS }}
          INFINITY_KEY_ALIAS: ${{ secrets.INFINITY_KEY_ALIAS }}
          INFINITY_KEY_PASS: ${{ secrets.INFINITY_KEY_PASS }}
        shell: bash
        run: |
          if [ -f app/infinity-signing.jks ]; then
            gradle --no-daemon :app:assembleRelease
          else
            echo "::warning::No stable signing secrets: building experimental debug APK; updates may require uninstall."
            gradle --no-daemon :app:assembleDebug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ALRADHY-World-Window-INFINITY-APK
          path: app/build/outputs/apk/**/*.apk
          retention-days: 2
          if-no-files-found: error
