name: INFINITY - Windows Self-Hosted Update APK

on:
  push:
    branches:
      - feature/infinity-v1-1-download-safety
      - feature/infinity-10010-performance-ux
    paths:
      - '.github/workflows/build-infinity-runner.yml'
      - 'app/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Certificate of the APK installed on the TV (builds 10001-10006). An APK signed with any
  # other key would force an uninstall and lose downloads, so it is never published.
  INFINITY_EXPECTED_CERT: f2d4cc3e847c93eca2f6024b30ca1acdde1c44a4bddcef78bf585e9c76afc5f8
  INFINITY_INSTALLED_VERSION: ${{ github.ref_name == 'feature/infinity-v1-1-download-safety' && '10006' || '10009' }}

concurrency:
  group: infinity-self-hosted-debug
  cancel-in-progress: true

jobs:
  android:
    # Never run pull requests, forks, or untrusted contributors on a personal laptop.
    if: github.repository == 'AbdullahSR007/ALRADHY-World-Window' && github.actor == 'AbdullahSR007'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 50
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - name: Checkout isolated INFINITY branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK 36
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = 'Continue'
          Start-Transcript -Path (Join-Path $env:RUNNER_WORKSPACE "..\infinity-ci-run-$($env:GITHUB_RUN_NUMBER).log") -Append | Out-Null
          $candidates = @($env:ANDROID_HOME, $env:ANDROID_SDK_ROOT)
          if ($env:LOCALAPPDATA) { $candidates += (Join-Path $env:LOCALAPPDATA 'Android\Sdk') }
          if ($env:USERPROFILE) { $candidates += (Join-Path $env:USERPROFILE 'AppData\Local\Android\Sdk') }
          $candidates += 'C:\Android\Sdk'
          if (Test-Path 'C:\Users') {
            $candidates += @(Get-ChildItem 'C:\Users' -Directory -ErrorAction SilentlyContinue |
              ForEach-Object { Join-Path $_.FullName 'AppData\Local\Android\Sdk' })
          }
          $sdk = $candidates | Where-Object {
            $_ -and (Test-Path (Join-Path $_ 'platforms\android-36\android.jar') -ErrorAction SilentlyContinue)
          } | Select-Object -First 1
          if (-not $sdk) {
            # The runner service (NETWORK SERVICE) cannot read the user's SDK, so keep a private,
            # cached SDK in the runner's tool cache. Downloaded once; later builds reuse it.
            $sdk = Join-Path $env:RUNNER_TOOL_CACHE 'android-sdk'
            $sdkmanager = Join-Path $sdk 'cmdline-tools\latest\bin\sdkmanager.bat'
            if (-not (Test-Path $sdkmanager)) {
              Write-Host 'Installing Android command-line tools for the runner (one time)...'
              $ProgressPreference = 'SilentlyContinue'
              [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
              New-Item -ItemType Directory -Force -Path $sdk | Out-Null
              $zip = Join-Path $env:RUNNER_TEMP 'cmdline-tools.zip'
              Invoke-WebRequest 'https://dl.google.com/android/repository/commandlinetools-win-11076708_latest.zip' -OutFile $zip
              $unpack = Join-Path $env:RUNNER_TEMP 'cmdline-unpack'
              Remove-Item $unpack -Recurse -Force -ErrorAction SilentlyContinue
              Expand-Archive $zip -DestinationPath $unpack -Force
              New-Item -ItemType Directory -Force -Path (Join-Path $sdk 'cmdline-tools') | Out-Null
              Move-Item (Join-Path $unpack 'cmdline-tools') (Join-Path $sdk 'cmdline-tools\latest')
            }
            if (-not (Test-Path (Join-Path $sdk 'platforms\android-36\android.jar')) -or
                -not (Test-Path (Join-Path $sdk 'build-tools\35.0.0\apksigner.bat'))) {
              Write-Host 'Installing Android SDK Platform 36 and Build-Tools 35.0.0 (one time)...'
              Write-Host "JAVA_HOME=$env:JAVA_HOME"
              $licenses = Join-Path $sdk 'licenses'
              New-Item -ItemType Directory -Force -Path $licenses | Out-Null
              # Standard Android SDK license acceptance (same hashes Android Studio writes).
              [IO.File]::WriteAllText((Join-Path $licenses 'android-sdk-license'),
                "`n24333f8a63b6825ea9c5514f83c2829b004d1fee`n8933bad161af4178b1185d1a37fbf41ea5269c55`nd56f5187479451eabf01fb78af6dfcb131a6481e")
              & cmd.exe /c "`"$sdkmanager`" --sdk_root=`"$sdk`" `"platforms;android-36`" `"build-tools;35.0.0`"" 2>&1 |
                ForEach-Object { Write-Host "$_" }
              Write-Host "sdkmanager exit code: $LASTEXITCODE"
            }
            if (-not (Test-Path (Join-Path $sdk 'platforms\android-36\android.jar'))) { throw 'Android SDK Platform 36 could not be installed.' }
          }
          Write-Host "Runner account: $env:USERNAME   Android SDK: $sdk"
          $debugKey = Join-Path $env:USERPROFILE '.android\debug.keystore'
          Write-Host "Debug keystore for this account: $debugKey  exists=$(Test-Path $debugKey)"
          [IO.File]::AppendAllText($env:GITHUB_ENV, "ANDROID_HOME=$sdk`n")
          [IO.File]::AppendAllText($env:GITHUB_ENV, "ANDROID_SDK_ROOT=$sdk`n")
          Write-Host 'Android SDK platform 36 detected.'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build INFINITY update APK
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = 'Continue'
          Start-Transcript -Path (Join-Path $env:RUNNER_WORKSPACE "..\infinity-ci-run-$($env:GITHUB_RUN_NUMBER).log") -Append | Out-Null
          # Sign with the key that signed 10001-10006 (kept on the laptop, never in the repo).
          $key = 'C:\actions-runners\ALRADHY-World-Window\signing\infinity-debug.keystore'
          if (-not (Test-Path $key)) { throw "Signing key missing at $key" }
          $env:INFINITY_KEYSTORE_PATH = $key
          $env:INFINITY_KEY_ALIAS = 'androiddebugkey'
          $env:INFINITY_STORE_PASS = 'android'
          $env:INFINITY_KEY_PASS = 'android'
          $env:INFINITY_STORE_TYPE = 'PKCS12'
          gradle --no-daemon :app:testReleaseUnitTest :app:assembleRelease
          if ($LASTEXITCODE -ne 0) { throw "Gradle build failed: $LASTEXITCODE" }

      - name: Verify in-place update compatibility
        id: verify
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = 'Continue'
          Start-Transcript -Path (Join-Path $env:RUNNER_WORKSPACE "..\infinity-ci-run-$($env:GITHUB_RUN_NUMBER).log") -Append | Out-Null
          $apk = Get-ChildItem app/build/outputs/apk/release/*.apk | Select-Object -First 1
          if (-not $apk) { throw 'No APK was produced.' }
          $tools = Get-Item (Join-Path $env:ANDROID_HOME 'build-tools\35.0.0') -ErrorAction SilentlyContinue
          if (-not $tools) { $tools = Get-ChildItem (Join-Path $env:ANDROID_HOME 'build-tools') -Directory | Sort-Object Name -Descending | Select-Object -First 1 }
          $badging = & (Join-Path $tools.FullName 'aapt.exe') dump badging $apk.FullName
          $line = $badging | Where-Object { $_ -like 'package: *' } | Select-Object -First 1
          if ($line -notmatch "name='([^']+)' versionCode='([0-9]+)' versionName='([^']*)'") { throw 'Unreadable manifest.' }
          $id = $Matches[1]; $code = [int]$Matches[2]; $name = $Matches[3]
          $certs = @(& (Join-Path $tools.FullName 'apksigner.bat') verify --print-certs $apk.FullName |
            ForEach-Object { if ($_ -match 'certificate SHA-256 digest: ([0-9a-f]{64})') { $Matches[1] } })
          Write-Host "Package $id  versionCode $code ($name)"
          Write-Host "Signing certificate SHA-256: $($certs -join ', ')"
          Write-Host "Runner account: $env:USERNAME  profile: $env:USERPROFILE"
          if ($id -cne 'com.alradhy.worldwindow.infinity') { throw "Application ID changed: $id" }
          if ($certs.Count -ne 1 -or $certs[0] -ne $env:INFINITY_EXPECTED_CERT) {
            throw "HELD: signed with $($certs -join ', '), not the installed app's certificate. Android would refuse this update."
          }
          if ($code -le [int]$env:INFINITY_INSTALLED_VERSION) { throw "versionCode $code must exceed $env:INFINITY_INSTALLED_VERSION" }
          $out = "INFINITY-$name-Android-TV-update-$code.apk"
          Copy-Item $apk.FullName $out
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "file=$out`n")
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "code=$code`n")
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "name=$name`n")
          Write-Host "VERIFIED: same app ID, same certificate, versionCode $code > $env:INFINITY_INSTALLED_VERSION"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: INFINITY-update-${{ steps.verify.outputs.code }}
          path: ${{ steps.verify.outputs.file }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish verified APK as a pre-release
        if: github.ref_name == 'feature/infinity-v1-1-download-safety'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          Start-Transcript -Path (Join-Path $env:RUNNER_WORKSPACE "..\infinity-ci-run-$($env:GITHUB_RUN_NUMBER).log") -Append | Out-Null
          $tag = "infinity-${{ steps.verify.outputs.code }}-${{ github.run_number }}"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $body = @{ tag_name = $tag; target_commitish = '${{ github.sha }}'; prerelease = $true
            name = "INFINITY ${{ steps.verify.outputs.name }} (${{ steps.verify.outputs.code }})"
            body = "Verified in-place update: same app ID and signing certificate, versionCode ${{ steps.verify.outputs.code }}." } | ConvertTo-Json
          $release = Invoke-RestMethod -Method Post -Headers $headers -Body $body -ContentType 'application/json' `
            -Uri "https://api.github.com/repos/${{ github.repository }}/releases"
          $file = '${{ steps.verify.outputs.file }}'
          $upload = $release.upload_url -replace '\{.*\}', "?name=$file"
          Invoke-RestMethod -Method Post -Headers $headers -InFile $file -ContentType 'application/vnd.android.package-archive' -Uri $upload | Out-Null
          Write-Host "Published $tag"
